syntax = "proto3";

package buffers.v1;

option go_package = "github.com/the-protobuf-project/buffers/plugin/pb/bufferspbv1;bufferspbv1";
option java_multiple_files = true;
option java_outer_classname = "SchemaProto";
option java_package = "com.buffers.v1";

// FileOptions carries the per-file names each target needs and proto does not
// declare.
//
// Applied via:
//
//	option (buffers.v1.file) = {
//	  namespace: "sensors.v1"
//	  ros_package: "sensor_msgs"
//	  file_id: "SNSR"
//	};
message FileOptions {
  // namespace is the FlatBuffers `namespace` and the Cap'n Proto
  // `$Cxx.namespace`. Defaults to the proto package, which is already dotted.
  string namespace = 1;

  // capnp_id pins the file's Cap'n Proto 64-bit ID.
  //
  // Left unset, the plugin derives one deterministically from the proto file
  // path (see protokit's buffers/capnpid.go) so that regenerating a schema
  // produces the same ID rather than the random one `capnp id` would mint. Set
  // it when adopting a .capnp file that already exists in the wild: its ID is
  // part of every consumer's build, and rederiving it would orphan them.
  //
  // Cap'n Proto requires the high bit set, so every valid ID read as a signed
  // integer is negative. That is the identity's bit pattern, not a quantity, and
  // the plugin renders it as `@0x%016x` of the same 64 bits.
  int64 capnp_id = 2;

  // ros_package is the ROS 2 package the emitted .msg and .srv files belong to.
  // Defaults to the proto package's first segment with dots replaced by
  // underscores, which is the ROS naming rule.
  string ros_package = 3;

  // jvm_package is the Kotlin or Java package Square Wire generates into.
  // Defaults to the file's `java_package` when it declares one, then to the
  // proto package.
  string jvm_package = 4;

  // file_id is the FlatBuffers `file_identifier`: a 4-character magic string
  // stamped into the buffer so a reader can reject a payload that is not the
  // schema it expected. Exactly 4 ASCII characters, or empty for none.
  string file_id = 5;

  // file_extension is the FlatBuffers `file_extension` used for binary payloads
  // written by the generated code, for example "bin".
  string file_extension = 6;

  // fbs_include adds `include` lines to the emitted .fbs beyond the ones derived
  // from the proto's own imports. An escape hatch for hand-written schema that
  // the generated file must compose with.
  repeated string fbs_include = 7;
}

// MessageOptions shapes how one message lands in each target.
message MessageOptions {
  // skip excludes the message from every target. A message reachable only from a
  // skipped message is not itself skipped: reachability is not a policy, and
  // silently dropping a type someone else imports is worse than emitting an
  // unused one.
  bool skip = 1;

  // layout selects the FlatBuffers table or struct distinction. See Layout.
  Layout layout = 2;

  // capnp_id pins this type's Cap'n Proto ID, for the same adoption reason
  // FileOptions.capnp_id exists. Derived from the file ID and the type's fully
  // qualified name when unset.
  int64 capnp_id = 3;

  // targets restricts the message to the named targets: "flatbuffers", "capnp",
  // "ros", or "wire". Empty means every target, which is the norm; a non-empty
  // list is how a message that only makes sense over one wire — a ROS-only
  // diagnostic record, say — stays out of the others.
  repeated string targets = 4;

  // ros_type overrides the ROS type name, which is otherwise the proto message
  // name. ROS requires one message per file named after the type, so this
  // renames the emitted file too.
  string ros_type = 5;

  // fbs_original_order emits FlatBuffers' `(original_order)` attribute, which
  // stops flatc reordering a table's fields by size for packing.
  //
  // It is rarely needed here, because this plugin assigns every field an
  // explicit `id:` and explicit ids already fix the vtable slots. It matters
  // when the emitted schema is hand-edited afterwards to drop those ids.
  bool fbs_original_order = 6;

  // fbs_root marks this message as the emitted .fbs file's `root_type`.
  //
  // FlatBuffers allows one root per schema file, and it is what `GetRootAsX`
  // is generated for. Nothing in a .proto identifies it: a file typically holds
  // several messages and proto has no notion of which one is the payload rather
  // than a part of it, so it has to be said here.
  //
  // Setting `file_id` without marking a root is a diagnostic, because a
  // FlatBuffers `file_identifier` is only legal alongside a `root_type` — flatc
  // rejects the pair, and finding that out from flatc rather than from here costs
  // a round trip through a toolchain the plugin may not have run.
  //
  // At most one message per file may set it.
  bool fbs_root = 7;
}

// FieldOptions shapes how one field lands in each target.
message FieldOptions {
  // skip excludes the field from every target.
  //
  // On a serialization schema this is a sharper instrument than it looks: a
  // skipped field is not merely absent from the generated code, it permanently
  // consumes its ordinal, because a later run that unskips it must land on the
  // same slot. The plugin records skipped fields in buffers.lock for that
  // reason.
  bool skip = 1;

  // ordinal pins the field's target slot: the FlatBuffers `id:` attribute and
  // the Cap'n Proto `@N`.
  //
  // Leave it unset. The plugin derives a stable ordinal from the proto field
  // number (see protokit's buffers/ordinal.go), and a derived ordinal that
  // never moves is worth more than a hand-written one that can be typo'd into
  // aliasing another field. Set it only to adopt an existing .capnp or .fbs
  // whose slots were assigned before this plugin existed — which is precisely
  // the case the derivation cannot reconstruct.
  //
  // Ordinals are 0-based, matching both target formats and unlike proto field
  // numbers, which start at 1.
  int32 ordinal = 2;

  // key marks the field as the FlatBuffers `(key)`: the one field a vector of
  // this table may be sorted by and binary-searched on. At most one per table.
  bool key = 3;

  // shared emits FlatBuffers' `(shared)` on a string field, so identical values
  // are written once and referenced twice. Worth it for a repeated enum-like
  // string; wasted on a field whose values are all distinct.
  bool shared = 4;

  // max_len bounds a repeated field or string for ROS, emitting `T[<=N]` or
  // `string<=N`. ROS bounds are part of the type, and an unbounded sequence in a
  // real-time message is the kind of thing a reviewer is looking for.
  //
  // Ignored by targets whose types carry no bound.
  int32 max_len = 5;

  // fixed_len makes a repeated field a ROS fixed-size array, `T[N]`, and a
  // FlatBuffers fixed-size array inside a struct.
  //
  // The proto side stays `repeated`, because proto cannot express a length. That
  // makes this a claim the producer must uphold rather than one the schema
  // enforces, and the generated doc comment says so on every affected field.
  int32 fixed_len = 6;

  // ros_default is a literal default value for the ROS field, emitted after the
  // field name. ROS defaults are a message-definition feature with no proto
  // equivalent, since proto3 has no field defaults.
  string ros_default = 7;

  // capnp_group folds this field, with every other field naming the same group,
  // into a Cap'n Proto `group`. Groups cost nothing on the wire — they are
  // presentation over the same slots — and are how a flat proto message with an
  // obvious internal grouping reads well in Cap'n Proto without changing layout.
  string capnp_group = 8;

  // targets restricts the field to the named targets. See
  // buffers.v1.MessageOptions.targets.
  repeated string targets = 9;
}

// EnumOptions shapes how one enum lands in each target.
message EnumOptions {
  // skip excludes the enum from every target.
  bool skip = 1;

  // underlying is the FlatBuffers enum's underlying integer type. Defaults to
  // INT_WIDTH_INT32, matching proto's own encoding; narrow it where the values
  // fit and the density matters.
  //
  // The plugin rejects a width that cannot hold every declared value, rather
  // than truncating.
  IntWidth underlying = 2;

  // bit_flags emits FlatBuffers' `(bit_flags)`, turning the enum into a bitmask
  // whose declared values are bit positions rather than values.
  //
  // AIP-126 requires a zero `_UNSPECIFIED` value, and a bit_flags enum cannot
  // have one — position 0 is a real bit. The plugin drops the unspecified value
  // for this enum only, and says so in a diagnostic, because silently keeping it
  // would make bit 0 mean "unspecified" for every consumer.
  bool bit_flags = 3;
}

// EnumValueOptions pins one enumerant's slot.
message EnumValueOptions {
  // ordinal pins the Cap'n Proto enumerant ordinal, which is 0-based and
  // contiguous — unlike a proto enum's value numbers, which are neither.
  //
  // As with buffers.v1.FieldOptions.ordinal: leave it unset unless adopting an
  // existing schema.
  int32 ordinal = 1;

  // skip excludes the value. It permanently consumes its ordinal, for the same
  // reason buffers.v1.FieldOptions.skip does.
  bool skip = 2;
}

// OneofOptions shapes how a proto oneof lands where the target has a union.
message OneofOptions {
  // union_type names the generated FlatBuffers union type, which unlike Cap'n
  // Proto's anonymous unions must be a named top-level type. Defaults to the
  // message name followed by the PascalCase oneof name, for example
  // `ReadingPayload`.
  string union_type = 1;

  // skip excludes the oneof and every field in it.
  bool skip = 2;
}

// Layout selects how a message is laid out in a target that distinguishes
// between an evolvable record and a packed one.
//
// It matters in exactly one target today — FlatBuffers, where a `table` carries
// a vtable and tolerates added and removed fields, while a `struct` is a
// fixed-size inline blob with no vtable, no defaults, and no evolution. The
// distinction is the difference between a 40-byte pose that memcpy's out of a
// shared-memory segment and one that costs a vtable indirection per field, which
// is why a robotics payload cares.
//
// It is declared here rather than in a FlatBuffers-specific option because the
// same statement — this record is fixed-shape and I am trading evolution for
// density — is the one Cap'n Proto reads to decide a field belongs in the data
// section rather than the pointer section.
enum Layout {
  // LAYOUT_UNSPECIFIED means LAYOUT_TABLE.
  //
  // The default is not inferred from the message's shape, and deliberately so. A
  // message of three doubles is struct-eligible; adding a string to it is an
  // ordinary, wire-compatible proto change. If the layout were inferred, that
  // edit would silently flip the message from a packed struct to a vtable-backed
  // table — which *is* a breaking change in FlatBuffers — and nothing would say
  // so. Packing is a deliberate trade of evolution for density, so it is opted
  // into rather than fallen into.
  LAYOUT_UNSPECIFIED = 0;

  // LAYOUT_TABLE is the evolvable, vtable-backed record. Always legal.
  LAYOUT_TABLE = 1;

  // LAYOUT_STRUCT is the packed, fixed-size record.
  //
  // A message is only eligible when every field is a fixed-width scalar, an
  // enum, or another struct: no strings, no bytes, no repeated fields, no maps,
  // no oneofs, and no message fields that are themselves tables. Asking for it
  // on a message that does not qualify is a build error naming the field that
  // disqualified it, rather than a silent downgrade — because the caller chose
  // LAYOUT_STRUCT for a memory-layout reason, and quietly giving them a table
  // would meet the schema's needs while missing the point.
  LAYOUT_STRUCT = 2;
}

// IntWidth names a concrete integer width, used where a target requires one and
// proto does not supply it.
//
// FlatBuffers enums carry an explicit underlying type; proto enums are always
// varint-encoded int32. Defaulting every generated enum to `int` wastes three
// bytes per value in a struct, which is exactly where it is least affordable.
enum IntWidth {
  // INT_WIDTH_UNSPECIFIED defaults to INT_WIDTH_INT32, matching proto's own
  // encoding.
  INT_WIDTH_UNSPECIFIED = 0;

  // INT_WIDTH_INT8 is a signed byte, -128 to 127.
  INT_WIDTH_INT8 = 1;

  // INT_WIDTH_UINT8 is an unsigned byte, 0 to 255. The usual choice for a small
  // closed enum in a high-rate message.
  INT_WIDTH_UINT8 = 2;

  // INT_WIDTH_INT16 is a signed 16-bit integer.
  INT_WIDTH_INT16 = 3;

  // INT_WIDTH_UINT16 is an unsigned 16-bit integer.
  INT_WIDTH_UINT16 = 4;

  // INT_WIDTH_INT32 is a signed 32-bit integer, matching proto's own enum
  // encoding.
  INT_WIDTH_INT32 = 5;

  // INT_WIDTH_UINT32 is an unsigned 32-bit integer.
  INT_WIDTH_UINT32 = 6;

  // INT_WIDTH_INT64 is a signed 64-bit integer.
  INT_WIDTH_INT64 = 7;

  // INT_WIDTH_UINT64 is an unsigned 64-bit integer. Legal, and almost never what
  // an enum needs.
  INT_WIDTH_UINT64 = 8;
}
